# Optional manual oneshot sweep (legacy). Continuous auditor units above are
# the production path; disable any previously-enabled nightly timer.
- name: install the auditor sweep script (manual ops)
  template:
    src: swift-audit-sweep.sh.j2
    dest: /usr/local/libexec/swift-audit-sweep.sh
    mode: "0755"
  when: "'storage_nodes' in group_names"

- name: install the auditor sweep oneshot unit (manual; not timed)
  copy:
    content: |
      [Unit]
      Description=Swift auditor sweep oneshot (rust manual)

      [Service]
      Type=oneshot
      ExecStart=/usr/local/libexec/swift-audit-sweep.sh
      StandardOutput=append:/var/log/swift/audit-sweep.log
      StandardError=append:/var/log/swift/audit-sweep.log
    dest: /etc/systemd/system/swift-audit-sweep.service
    mode: "0644"
  when: "'storage_nodes' in group_names"

- name: disable legacy nightly auditor timer (replaced by continuous daemons)
  systemd:
    name: swift-audit-sweep.timer
    enabled: no
    state: stopped
    daemon_reload: yes
  failed_when: false
  when: "'storage_nodes' in group_names"
