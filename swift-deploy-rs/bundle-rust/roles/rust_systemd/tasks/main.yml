---
# One systemd unit per swift service, installed only for the roles this host
# holds. unit.yml renders the shared template, enables + starts the unit when
# it is not already running, and restarts it when the unit file drifted, so
# a steady-state re-apply converges with changed=0.
#
# Auditors (P2b): continuous conf-driven daemons (interval sleep), matching
# Python ObjectAuditor / DatabaseAuditor. Legacy one-shot CLI + optional
# nightly sweep script remain for manual ops.

- name: account server unit
  include_tasks:
    file: unit.yml
    unit_name: swift-account
    svc_description: Swift account server (rust)
    svc_bin: swift-account-server
    svc_args: ""
    svc_conf: account-server.conf
  when: "'account_servers' in group_names"

- name: container server unit
  include_tasks:
    file: unit.yml
    unit_name: swift-container
    svc_description: Swift container server (rust)
    svc_bin: swift-container-server
