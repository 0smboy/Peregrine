---
account_ring:
    create_ring_info:
        account_swift_partition_power: 10
        account_swift_replicas: 3
        account_swift_minimum_time: 1
    ring_content:
        # 节点盘数量与名称对称,配置格式如下
        - region: 1
          zone: 1
          # 非整段的 IP 可以通过`,`分隔写多个段，或者单独一个 IP
          # 例如 192.168.2.51-192.168.2.53,192.168.2.100-192.168.2.105,192.168.2.201
          storage_ips:     192.168.2.51-192.168.2.53
          replication_ips: 192.168.2.51-192.168.2.53
          common_disk_info:
              # 格式: 端口号_{"hdd":hdd序号,"ssd":ssd序号}_权重
              # 注意: 盘符要加双引号,下划线为连接符,不能有空格
              - 6002_{"hdd":"001-010","ssd":""}_100
          # 节点盘数量不对称,配置指定机器额外盘的格式如下,对称则为空
          dedicated_disk_info:
              # 格式: 存储网络ip_复制网络ip_端口号_{"hdd":hdd序号,"ssd":ssd序号}_权重
              # 注意: 盘符要加双引号,下划线为连接符,不能有空格
              # - 192.168.2.51_192.168.2.51_6002_{"hdd":"","ssd":"001-002"}_100
        # 配置多个region/zone时,配置不同的region/zone的格式如下，如果只需一个zone，则可把下面13行注释：
        - region: 1
          zone: 2
          storage_ips:     192.168.2.54-192.168.2.54
          replication_ips: 192.168.2.54-192.168.2.54
          common_disk_info:
              # 格式: 端口号_{"hdd":hdd序号,"ssd":ssd序号}_权重
              # 注意: 盘符要加双引号,下划线为连接符,不能有空格
              - 6002_{"hdd":"001-010","ssd":""}_100
          # 节点盘数量不对称,配置指定机器额外盘的格式如下,对称则为空
          dedicated_disk_info:
              # 格式: 存储网络ip_复制网络ip_端口号_{"hdd":hdd序号,"ssd":ssd序号}_权重
              # 注意: 盘符要加双引号,下划线为连接符,不能有空格
              # - 192.168.2.54_192.168.2.54_6002_{"hdd":"","ssd":"001-002"}_100


