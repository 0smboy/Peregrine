---
- name: Stopping/killing mariadb service
  shell: pkill -9 -u mysql || true

- name: Deleting old mariadb
  yum:
    name: ['mariadb','mariadb-server', 'MariaDB-backup', 'galera-4', 'python3-PyMySQL']
    state: removed

- name: Removing old mariadb directory
  file:
    path: "{{item}}"
    state: absent
  with_items:
  - /var/lib/mysql/
  - /usr/share/mysql/
  - /etc/my.cnf.d/
  - /etc/my.cnf
  - ~/.my.cnf

- name: Installing mariadb packages
  package:
    name={{ item }}
    state=latest
  with_items:
    - mariadb
    - mariadb-server
    - MariaDB-backup
    - galera
    - python3-PyMySQL
