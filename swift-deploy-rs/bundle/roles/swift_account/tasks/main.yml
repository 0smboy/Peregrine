---
- name: Deliver account-server.conf
  template: src=templates/account-server.conf.j2
            dest=/etc/swift/account-server.conf
- name: Set rsyncd.conf
  ini_file: dest=/etc/rsyncd.conf
            section=account
            option={{ item.key }}
            value={{ item.value }}
  with_dict:
      "max connections": "{{ max_connections }}"
      path: /srv/node
      "read only": "{{ read_only }}"
      "lock file": "{{ lock_file }}"
