---
- name: Backup existing rings before distribute
  shell: |
    set -euo pipefail
    stamp=$(date -u +%Y%m%dT%H%M%SZ)
    dest="/root/work/hkserver-add/ring-pre-distribute-$stamp"
    mkdir -p "$dest"
    shopt -s nullglob
    files=(/etc/swift/*.ring.gz /etc/swift/*.builder.json)
    if [ ${#files[@]} -gt 0 ]; then
      cp -a "${files[@]}" "$dest/"
    fi
    echo BACKUP_OK

- name: Install account ring
  copy:
    src: /tmp/hkserver-add-20261004/rings/account.ring.gz
    dest: /etc/swift/account.ring.gz
    mode: "0644"

- name: Install account builder
  copy:
    src: /tmp/hkserver-add-20261004/rings/account.ring.gz.builder.json
    dest: /etc/swift/account.ring.gz.builder.json
    mode: "0644"

