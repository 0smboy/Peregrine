# Full-workspace test gate for swift-rust/.
#
# Motivation: tests used to be run manually (and filtered) on lab nodes only,
# which let the proxy-server bin test target stay broken for weeks. This
# workflow makes the FULL suite an automatic gate on every push and PR.
#
# docs-site publishing is handled separately by deploy-docs.yml; this workflow
# deliberately does not touch docs-site/.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hint for swift-ec's build.rs; matches the source-built install below.
  LIBERASURECODE_LIB_DIR: /usr/local/lib

jobs:
  test:
    name: fmt + workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      # Ubuntu 24.04 packages liberasurecode 1.6.2, whose get_fragment_partition
      # bounds bug causes intermittent SIGSEGV in swift-ec's multi-segment test
      # (fixed upstream in 1.6.4, per its ChangeLog). The lab environment builds
      # from source too, so CI matches it: build and install 1.6.4.
      - name: Build liberasurecode 1.6.4 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool zlib1g-dev
          curl -sSL -o liberasurecode.tar.gz https://github.com/openstack/liberasurecode/archive/refs/tags/1.6.4.tar.gz
          tar xf liberasurecode.tar.gz
          cd liberasurecode-1.6.4
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-rust

      # Report-only: main carries pre-existing rustfmt drift (15 files, merged
      # after chore/fmt-all without re-running fmt). Fixing it requires source
      # changes, which are out of scope for the CI branch. Same handling as the
      # clippy backlog below: keep the output visible, do not block the gate.
      - name: cargo fmt --check (report only, pre-existing drift)
        working-directory: swift-rust
        continue-on-error: true
        run: cargo fmt --all --check

      - name: cargo test (full workspace)
        working-directory: swift-rust
        run: cargo test --workspace --locked

      - name: cargo test (EC slice)
        working-directory: swift-rust
        run: cargo test -p swift-ec -p swift-object-server -p swift-proxy-server --features swift-proxy-server/ec,swift-object-server/ec --locked

  # Report-only: the full workspace has a pre-existing -D warnings backlog
  # (clippy was previously only enforced for key packages). Kept visible as a
  # report board; must not be made green by touching source from this branch.
  clippy:
    name: clippy (workspace, report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Install liberasurecode
        run: sudo apt-get update && sudo apt-get install -y liberasurecode-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: swift-rust

      - name: cargo clippy -D warnings
        working-directory: swift-rust
        run: cargo clippy --workspace --locked -- -D warnings
