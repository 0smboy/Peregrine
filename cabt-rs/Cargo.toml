[package]
name = "cabt"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["0smboy"]
description = "Automation benchmark tool for Cosbench / cosbench-rs (Rust rewrite of cabt x86-64)"
repository = "https://github.com/0smboy/myfile"

[[bin]]
name = "cabt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cosbench-core = { path = "../cosbench-rs/crates/cosbench-core" }
csv = "1"
indicatif = "0.17"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
rust_xlsxwriter = "0.79"

[dev-dependencies]
tempfile = "3"
