global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - 10.0.0.1:9100
          - 10.0.0.2:9100
          - 10.0.0.3:9100
          - 10.0.0.4:9100
    metric_relabel_configs:
      # Contabo planes: eth1=proxy/public, eth2=storage, eth3=replication
      - source_labels: [device]
        regex: eth1
        target_label: plane
        replacement: public
      - source_labels: [device]
        regex: eth2
        target_label: plane
        replacement: storage
      - source_labels: [device]
        regex: eth3
        target_label: plane
        replacement: replication
  - job_name: statsd
    static_configs:
      - targets:
          - 10.0.0.1:9102
          - 10.0.0.2:9102
          - 10.0.0.3:9102
          - 10.0.0.4:9102
