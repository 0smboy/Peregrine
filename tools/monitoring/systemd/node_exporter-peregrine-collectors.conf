# W10 drop-in: /etc/systemd/system/node_exporter.service.d/10-peregrine-collectors.conf
# Adds the systemd collector (swift-* units only) on top of the R0 unit file,
# which stays untouched. ExecStart must be cleared before being redefined.
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter \
  --web.listen-address=:9100 \
  --collector.textfile.directory=/var/lib/node_exporter/textfile_collector \
  --collector.systemd \
  --collector.systemd.unit-include=^swift-.*
