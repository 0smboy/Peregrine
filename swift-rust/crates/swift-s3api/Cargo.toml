[package]
name = "swift-s3api"
description = "S3 API translation core (request parsing, AWS Signature V4, S3 XML) for the Rust implementation of OpenStack Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
swift-http = { path = "../swift-http" }
swift-middleware = { path = "../swift-middleware" }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
xmlparser = "0.13"
