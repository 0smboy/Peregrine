[package]
name = "swift-ring"
description = "Consistent hashing ring reader for the Rust implementation of OpenStack Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
swift-core = { path = "../swift-core" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
