[package]
name = "swift-http"
description = "swob-compatible HTTP primitives and server plumbing for the Rust implementation of OpenStack Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "tokio"] }
libc = "0.2"
swift-core = { path = "../swift-core" }
swift-runtime = { path = "../swift-runtime" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
serde_json = "1"
swift-object-server = { path = "../swift-object-server" }
swift-diskfile = { path = "../swift-diskfile" }

