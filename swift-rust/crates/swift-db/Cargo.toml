[package]
name = "swift-db"
description = "Account/container SQLite backends for the Rust implementation of OpenStack Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
swift-core = { path = "../swift-core" }
swift-ring = { path = "../swift-ring" }
md-5 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
swift-runtime = { path = "../swift-runtime" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
