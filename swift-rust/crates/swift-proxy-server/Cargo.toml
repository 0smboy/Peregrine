[package]
name = "swift-proxy-server"
description = "Proxy server for the Rust implementation of OpenStack Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
swift-core = { path = "../swift-core" }
swift-http = { path = "../swift-http" }
swift-ring = { path = "../swift-ring" }
swift-middleware = { path = "../swift-middleware" }
# Erasure coding links liberasurecode (Linux-only), so it is opt-in: the EC
# proxy path is built only with `--features ec`. Without it, EC object requests
# return 501 and replication is unaffected (so the crate still builds on macOS).
swift-ec = { path = "../swift-ec", optional = true }
md-5 = { version = "0.10", optional = true }
serde_json = "1"

[features]
ec = ["dep:swift-ec", "dep:md-5"]

[dev-dependencies]
serde_json = "1"
swift-account-server = { path = "../swift-account-server" }
swift-container-server = { path = "../swift-container-server" }
swift-object-server = { path = "../swift-object-server" }
swift-diskfile = { path = "../swift-diskfile" }
