[package]
name = "swift-container-server"
description = "Container server for the Rust implementation of OpenStack Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
swift-core = { path = "../swift-core" }
swift-db = { path = "../swift-db" }
swift-http = { path = "../swift-http" }
swift-ring = { path = "../swift-ring" }
swift-runtime = { path = "../swift-runtime" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }
serde_json = "1"
hmac = "0.12"
sha1 = "0.10"
# Same TLS stack as swift-middleware (authtoken/s3token outbound HTTPS).
native-tls = "0.2"

# The server binary (src/main.rs) is auto-detected as `swift-container-server`.
[[bin]]
name = "swift-container-updater"
path = "src/bin/container_updater.rs"

[[bin]]
name = "swift-container-reconciler"
path = "src/bin/container_reconciler.rs"

[[bin]]
name = "swift-container-sharder"
path = "src/bin/container_sharder.rs"

[[bin]]
name = "swift-container-sync"
path = "src/bin/container_sync.rs"

[dev-dependencies]
swift-db = { path = "../swift-db" }
swift-account-server = { path = "../swift-account-server" }
