global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats mode 660 level admin

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option                  http-server-close
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          60s
    timeout server          60s
    timeout http-keep-alive 10s
    timeout check           5s
    maxconn                 3000

# Identical on every node, so any node is a working entry point and the file can
# be compared by checksum across the cluster. Binding 0.0.0.0 rather than one
# node's address is what makes that possible; net.ipv4.ip_nonlocal_bind=1 also
# lets this bind a floating address the node does not currently hold.
# Replicate the token stick-table across all four HAProxies.
#
# Each HAProxy keeps its own table, so behind an Azure load balancer that is
# free to send request 1 to swift1 and request 2 to swift3, the second node has
# never seen the token and routes it by leastconn to a proxy that did not issue
# it — a 401. Peer replication makes the four tables one table, which is what
# lets the LB stay stateless (no session persistence needed on the Azure side).
#
# Peer names must match `hostname` on each node; each instance skips its own entry.
peers swift_lb
    peer swift1 10.42.30.11:10000
    peer swift2 10.42.30.12:10000
    peer swift3 10.42.30.13:10000
    peer swift4 10.42.30.14:10000

frontend swift_proxy_front
    bind 0.0.0.0:8085
    default_backend swift_proxy_back

backend swift_proxy_back
    # Stick on the auth TOKEN, not the source IP.
    #
    # tempauth keeps issued tokens in process memory (a Mutex<HashMap> per
    # proxy, no shared cache), so a token minted by one proxy is a 401 at the
    # other three. Plain leastconn therefore fails ~3 of every 4 authenticated
    # requests — measured, 9 of 12 objects returned 401.
    #
    # `balance source` avoids that by pinning a client IP to one backend, but it
    # pins far more coarsely than the constraint requires: every client behind a
    # NAT, and every token that client holds, lands on the same proxy. That is
    # what made one proxy do 52 MiB/s while the other two did 388 and 304.
    #
    # The real unit of affinity is the token. Sticking on it keeps each token on
    # its issuing proxy (correct) while letting different tokens spread across
    # all four (fast). Requests with no token — /auth/v1.0 itself, healthchecks —
    # fall through to leastconn.
    #
    # The durable fix is a shared token store so any proxy can validate any
    # token; then this whole stanza becomes plain leastconn.
    balance leastconn
    # store-response is the half that makes this work: when a proxy answers
    # /auth/v1.0 it returns the token it just minted, and that response teaches
    # the table which backend owns it. Matching on the request alone is not
    # enough — the first request carrying a token would be routed by leastconn
    # to whichever proxy is idle, which is exactly the proxy that has never
    # heard of it (measured: 0 of 24 objects retrievable).
    stick-table type string len 64 size 100k expire 24h peers swift_lb
    stick store-response res.hdr(X-Auth-Token)
    stick on req.hdr(X-Auth-Token)
    option httpchk GET /healthcheck
    http-check expect status 200
    server proxy1 10.42.30.11:8080 check inter 5s fall 3 rise 2
    server proxy2 10.42.30.12:8080 check inter 5s fall 3 rise 2
    server proxy3 10.42.30.13:8080 check inter 5s fall 3 rise 2
    server proxy4 10.42.30.14:8080 check inter 5s fall 3 rise 2

# Loopback-only for the human-readable page; the Prometheus endpoint binds the
# storage plane so the monitoring host can scrape it. Neither is on the client
# plane, so backend topology is never exposed to a client of the object API.
#
# Four HAProxy instances now carry every request in the cluster and nothing
# was watching them: a backend flapping, a queue building or a 5xx rate rising
# would have been invisible. 2.8 exposes Prometheus natively, so this needs no
# exporter alongside it.
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 10s

frontend metrics
    bind 0.0.0.0:8405
    http-request use-service prometheus-exporter if { path /metrics }
    http-request deny
    no log
